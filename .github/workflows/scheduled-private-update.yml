name: Scheduled private update

on:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:
    inputs:
      persist_private_state:
        description: Commit and push the verified candidate state to the private data repository
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-private-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.BREACHGAZETTE_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      data_ref: ${{ steps.private-revision.outputs.data_ref }}
    env:
      BREACHGAZETTE_SCHEDULE_ENABLED: ${{ vars.BREACHGAZETTE_SCHEDULE_ENABLED }}
    steps:
      - name: Resolve private production-data branch
        id: data-ref
        env:
          CONFIGURED_DATA_REF: ${{ vars.BREACHGAZETTE_DATA_REF }}
        run: |
          if test -z "$CONFIGURED_DATA_REF"; then
            echo "Configure BREACHGAZETTE_DATA_REF before enabling updates."
            exit 1
          fi
          if ! git check-ref-format --branch "$CONFIGURED_DATA_REF" > /dev/null 2>&1; then
            echo "BREACHGAZETTE_DATA_REF must name a writable branch."
            exit 1
          fi
          echo "data_ref=$CONFIGURED_DATA_REF" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Mint write-scoped private-state token
        id: state-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BREACHGAZETTE_STATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BREACHGAZETTE_STATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BREACHGAZETTE_DATA_REPOSITORY }}
          permission-contents: write
      - name: Check out private production state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.BREACHGAZETTE_DATA_REPOSITORY }}
          ref: ${{ steps.data-ref.outputs.data_ref }}
          token: ${{ steps.state-token.outputs.token }}
          path: .private-production-data
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate source and monitoring policy
        run: |
          breachgazette validate-source-policies --json
          breachgazette validate-monitoring --json
          breachgazette validate-aliases --data-root .private-production-data --json
          breachgazette validate-relationships --data-root .private-production-data --json
      - name: Verify and promote an isolated candidate
        id: update_cycle
        continue-on-error: true
        run: breachgazette update-cycle --data-root .private-production-data --promote --json
      - name: Write sanitized operator summary
        if: always()
        continue-on-error: true
        run: |
          if test "${{ steps.update_cycle.outcome }}" != "success"; then
            echo "## Breach Gazette source health" >> "$GITHUB_STEP_SUMMARY"
            echo "The bounded update failed and no candidate state was promoted." >> "$GITHUB_STEP_SUMMARY"
          elif test -f .private-production-data/reports/source-health.json; then
            breachgazette source-health-summary \
              .private-production-data/reports/source-health.json \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Breach Gazette source health" >> "$GITHUB_STEP_SUMMARY"
            echo "No candidate health report was promoted." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breachgazette-source-health
          path: .private-production-data/reports/source-health.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified private state
        if: >-
          steps.update_cycle.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.persist_private_state)
        working-directory: .private-production-data
        run: |
          git config --local user.name "breachgazette-update"
          git config --local user.email "breachgazette-update@users.noreply.github.com"
          git add -- checkpoints events manifests metadata reports reviews state
          if git diff --cached --quiet; then
            echo "No private state changes to commit."
          else
            git commit -m "Update verified Breach Gazette source state"
            git push origin HEAD
          fi
      - name: Resolve promoted private-state revision
        if: >-
          steps.update_cycle.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.persist_private_state)
        id: private-revision
        working-directory: .private-production-data
        run: |
          data_revision="$(git rev-parse HEAD)"
          if [[ ! "$data_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The promoted private-state revision is invalid."
            exit 1
          fi
          echo "data_ref=$data_revision" >> "$GITHUB_OUTPUT"
      - name: Fail incomplete update after preserving health report
        if: steps.update_cycle.outcome != 'success'
        run: exit 1

  publish:
    name: Publish verified private state
    needs: update
    if: >-
      needs.update.result == 'success' &&
      (github.event_name == 'schedule' || inputs.persist_private_state)
    uses: ./.github/workflows/netlify.yml
    with:
      data_ref: ${{ needs.update.outputs.data_ref }}
    secrets:
      BREACHGAZETTE_STATE_APP_PRIVATE_KEY: ${{ secrets.BREACHGAZETTE_STATE_APP_PRIVATE_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
