name: Update dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dry-run
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run bounded fixed-source update
        run: |
          breachgazette validate-source-policies --json
          breachgazette validate-monitoring --json
          breachgazette validate-aliases \
            --catalogue tests/fixtures/reviews/organization-aliases.yml --json
          breachgazette validate-relationships \
            --catalogue tests/fixtures/reviews/relationship-decisions.yml --json
          breachgazette update --data-root "$RUNNER_TEMP/breachgazette-dry-run" --json
          breachgazette source-health \
            --data-root "$RUNNER_TEMP/breachgazette-dry-run" \
            --output "$RUNNER_TEMP/source-health.json" \
            --json
          breachgazette quality-report --data-root "$RUNNER_TEMP/breachgazette-dry-run" --json
