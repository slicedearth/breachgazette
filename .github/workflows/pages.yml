name: Publish Pages

on:
  workflow_dispatch:
    inputs:
      data_ref:
        description: Commit or tag in the configured private production-data repository
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out configured private real-data state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.BREACHGAZETTE_DATA_REPOSITORY }}
          ref: ${{ inputs.data_ref }}
          ssh-key: ${{ secrets.BREACHGAZETTE_DATA_DEPLOY_KEY }}
          path: .private-production-data
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm ci --ignore-scripts --prefix site
      - name: Generate privacy-minimised real publication
        run: |
          breachgazette quality-report --data-root .private-production-data --json
          breachgazette build-site-data --data-root .private-production-data --output "$RUNNER_TEMP/publication" --json
      - name: Build production site
        env:
          BREACHGAZETTE_SITE_DATA_DIR: ${{ runner.temp }}/publication
          BREACHGAZETTE_PAGES_BUILD: "1"
        working-directory: site
        run: |
          npm run check
          npm run build:budget
          breachgazette audit-public-tree dist --json
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
    outputs:
      artifact: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
