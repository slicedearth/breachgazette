name: Publish Netlify

on:
  workflow_call:
    inputs:
      data_ref:
        description: Private production-data branch, tag, or commit to publish
        required: false
        type: string
    secrets:
      BREACHGAZETTE_STATE_APP_PRIVATE_KEY:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      data_ref:
        description: Commit or tag in the configured private production-data repository
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment:
      name: netlify-production
      url: ${{ steps.deploy.outputs.deploy_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify source revision passed the complete CI gate
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_revision="$(git rev-parse HEAD)"
          successful_runs="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$source_revision" \
              -f status=success \
              -f per_page=10 \
              --jq '.total_count'
          )"
          if test "$successful_runs" -lt 1; then
            echo "The selected source revision has not passed the complete CI gate."
            exit 1
          fi
      - name: Resolve private production-data revision
        id: data-ref
        env:
          CONFIGURED_DATA_REF: ${{ vars.BREACHGAZETTE_DATA_REF }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DATA_REF: ${{ inputs.data_ref }}
        run: |
          data_ref="$REQUESTED_DATA_REF"
          if test -z "$data_ref"; then
            data_ref="$CONFIGURED_DATA_REF"
          fi
          if test -z "$data_ref"; then
            echo "Configure BREACHGAZETTE_DATA_REF for automatic publication."
            exit 1
          fi
          if test "$EVENT_NAME" = "workflow_dispatch" \
            && [[ ! "$data_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Manual publication requires an exact 40-character private-state commit."
            exit 1
          fi
          if ! git check-ref-format --allow-onelevel "$data_ref" > /dev/null 2>&1; then
            echo "The private production-data revision is not a safe Git ref."
            exit 1
          fi
          echo "data_ref=$data_ref" >> "$GITHUB_OUTPUT"
      - name: Mint read-only private-state token
        id: state-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BREACHGAZETTE_STATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BREACHGAZETTE_STATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BREACHGAZETTE_DATA_REPOSITORY }}
          permission-contents: read
      - name: Check out configured private real-data state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.BREACHGAZETTE_DATA_REPOSITORY }}
          ref: ${{ steps.data-ref.outputs.data_ref }}
          token: ${{ steps.state-token.outputs.token }}
          path: .private-production-data
          persist-credentials: false
      - name: Record resolved revisions
        id: revisions
        run: |
          source_revision="$(git rev-parse HEAD)"
          data_revision="$(git -C .private-production-data rev-parse HEAD)"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "## Breach Gazette production inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source revision: \`$source_revision\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Private data revision: \`$data_revision\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm ci --ignore-scripts --no-audit --prefix site
      - name: Generate privacy-minimised real publication
        id: publication
        env:
          BREACHGAZETTE_SCHEDULE_ENABLED: ${{ vars.BREACHGAZETTE_SCHEDULE_ENABLED }}
        run: |
          breachgazette quality-report --data-root .private-production-data --json
          breachgazette build-site-data \
            --data-root .private-production-data \
            --output "$RUNNER_TEMP/publication" \
            --json > "$RUNNER_TEMP/publication-build.json"
          publication_checksum="$(
            jq -r '.publication_checksum // empty' \
              "$RUNNER_TEMP/publication-build.json"
          )"
          if [[ ! "$publication_checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Publication generation returned an invalid checksum."
            exit 1
          fi
          echo "checksum=$publication_checksum" >> "$GITHUB_OUTPUT"
      - name: Build and audit production site
        env:
          BREACHGAZETTE_SITE_DATA_DIR: ${{ runner.temp }}/publication
          BREACHGAZETTE_SITE_URL: ${{ vars.BREACHGAZETTE_SITE_URL }}
          BREACHGAZETTE_SOURCE_REVISION: ${{ steps.revisions.outputs.source_revision }}
        working-directory: site
        run: |
          npm run check
          npm run build:budget
          breachgazette audit-public-tree dist --json
      - name: Package audited static tree
        id: package
        run: |
          (
            cd site/dist
            zip -q -r -X -D "$RUNNER_TEMP/breachgazette-site.zip" .
          )
          archive_sha256="$(
            sha256sum "$RUNNER_TEMP/breachgazette-site.zip" | cut -d ' ' -f 1
          )"
          if [[ ! "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Deployment archive returned an invalid SHA-256 digest."
            exit 1
          fi
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "- Publication checksum: \`${{ steps.publication.outputs.checksum }}\`" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment archive SHA-256: \`$archive_sha256\`" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy audited static tree
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          if [[ ! "$NETLIFY_SITE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "NETLIFY_SITE_ID contains unsupported characters."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$RUNNER_TEMP/breachgazette-site.zip" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?production=true" \
            > "$RUNNER_TEMP/netlify-deploy.json"
          deploy_id="$(jq -r '.id // empty' "$RUNNER_TEMP/netlify-deploy.json")"
          if [[ ! "$deploy_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Netlify returned an invalid deploy identifier."
            exit 1
          fi
          for attempt in $(seq 1 120); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$deploy_id" \
              > "$RUNNER_TEMP/netlify-deploy.json"
            state="$(jq -r '.state // empty' "$RUNNER_TEMP/netlify-deploy.json")"
            if test "$state" = "ready"; then
              break
            fi
            if test "$state" = "error"; then
              echo "Netlify deploy entered the error state."
              exit 1
            fi
            if test "$attempt" = "120"; then
              echo "Netlify deploy did not become ready within ten minutes."
              exit 1
            fi
            sleep 5
          done
          published_at="$(jq -r '.published_at // empty' \
            "$RUNNER_TEMP/netlify-deploy.json")"
          if test -z "$published_at"; then
            echo "Netlify marked the deploy ready without publishing it."
            exit 1
          fi
          deploy_url="$(jq -r \
            '[.deploy_ssl_url, .deploy_url, .ssl_url, .url]
              | map(select(type == "string" and length > 0))
              | .[0] // empty' \
            "$RUNNER_TEMP/netlify-deploy.json")"
          if [[ ! "$deploy_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "Netlify returned an invalid HTTPS deployment URL."
            exit 1
          fi
          deploy_url="${deploy_url%/}"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
      - name: Create deployment provenance record
        run: |
          jq -n \
            --arg source_revision "${{ steps.revisions.outputs.source_revision }}" \
            --arg publication_checksum "${{ steps.publication.outputs.checksum }}" \
            --arg archive_sha256 "${{ steps.package.outputs.archive_sha256 }}" \
            --arg deploy_id "${{ steps.deploy.outputs.deploy_id }}" \
            --arg deploy_url "${{ steps.deploy.outputs.deploy_url }}" \
            --arg published_at "${{ steps.deploy.outputs.published_at }}" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema_version: "1.0",
              subject: {
                name: "breachgazette-site.zip",
                sha256: $archive_sha256
              },
              source_revision: $source_revision,
              publication_checksum: $publication_checksum,
              deployment: {
                id: $deploy_id,
                url: $deploy_url,
                published_at: $published_at
              },
              workflow: {
                ref: $workflow_ref,
                run_id: $run_id,
                run_attempt: $run_attempt
              },
              assurance: {
                signed: false,
                statement: "Checksummed workflow provenance; not a cryptographic signature."
              }
            }' > "$RUNNER_TEMP/deployment-provenance.json"
      - name: Preserve deployment archive and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ steps.revisions.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/breachgazette-site.zip
            ${{ runner.temp }}/deployment-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Verify live content identity and security headers
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          EXPECTED_CHECKSUM: ${{ steps.publication.outputs.checksum }}
          EXPECTED_SOURCE_REVISION: ${{ steps.revisions.outputs.source_revision }}
          PRODUCTION_URL: ${{ vars.BREACHGAZETTE_SITE_URL }}
        run: |
          if [[ ! "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "BREACHGAZETTE_SITE_URL is not a valid HTTPS origin."
            exit 1
          fi
          live_urls=("$DEPLOY_URL")
          if test "$DEPLOY_URL" != "${PRODUCTION_URL%/}"; then
            live_urls+=("${PRODUCTION_URL%/}")
          fi
          for live_url in "${live_urls[@]}"; do
            identity_file="$RUNNER_TEMP/publication-identity-$RANDOM.json"
            manifest_file="$RUNNER_TEMP/search-manifest-$RANDOM.json"
            header_file="$RUNNER_TEMP/netlify-response-headers-$RANDOM.txt"
            identity_verified=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent \
                -H "Cache-Control: no-cache" \
                --output "$identity_file" \
                "$live_url/data/publication.json?publication=$EXPECTED_CHECKSUM" \
                && jq -e \
                  --arg checksum "$EXPECTED_CHECKSUM" \
                  --arg source_revision "$EXPECTED_SOURCE_REVISION" \
                  '.publication_checksum == $checksum
                    and .source_revision == $source_revision
                    and .record_counts.notifications > 0' \
                  "$identity_file" > /dev/null; then
                identity_verified=true
                break
              fi
              if test "$attempt" = "60"; then
                echo "Live publication identity did not become current within five minutes: $live_url"
                exit 1
              fi
              sleep 5
            done
            test "$identity_verified" = "true"
            curl --fail --silent --show-error \
              "$live_url/data/notifications/manifest.json" > "$manifest_file"
            identity_records="$(jq -r '.record_counts.notifications' "$identity_file")"
            manifest_records="$(jq -r '.record_count' "$manifest_file")"
            test "$identity_records" = "$manifest_records"
            curl --fail --silent --show-error \
              "$live_url/feeds/notifications.xml" > /dev/null
            curl --fail --silent --show-error \
              "$live_url/feeds/corrections.xml" > /dev/null
            curl --fail --silent --show-error \
              "$live_url/robots.txt" > /dev/null
            for smoke_path in \
              "/jurisdictions/" \
              "/france/" \
              "/source-coverage/" \
              "/.well-known/security.txt"; do
              curl --fail --silent --show-error \
                "$live_url$smoke_path" > /dev/null
            done
            curl --fail --silent --show-error \
              --output /dev/null \
              --dump-header "$header_file" \
              "$live_url/"
            tr -d '\r' < "$header_file" \
              | tr '[:upper:]' '[:lower:]' \
              > "$header_file.normalized"
            grep -F "content-security-policy:" "$header_file.normalized"
            grep -F "frame-ancestors 'none'" "$header_file.normalized"
            grep -F "strict-transport-security: max-age=31536000" \
              "$header_file.normalized"
            grep -F "x-content-type-options: nosniff" "$header_file.normalized"
            grep -F "x-frame-options: deny" "$header_file.normalized"
            grep -F "referrer-policy: no-referrer" "$header_file.normalized"
            grep -F "permissions-policy:" "$header_file.normalized"
            grep -F "cross-origin-opener-policy: same-origin" "$header_file.normalized"
          done
