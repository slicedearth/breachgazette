name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python scripts/lock_python.py --check-installed
      - name: Verify Python
        run: |
          ruff check .
          ruff check --select S src
          mypy src
          pytest --cov=breachgazette --cov-report=term-missing --cov-fail-under=80
          breachgazette validate-monitoring --json
          breachgazette validate-aliases \
            --catalogue tests/fixtures/reviews/organization-aliases.yml --json
          breachgazette validate-relationships \
            --catalogue tests/fixtures/reviews/relationship-decisions.yml --json
          pip-audit -r requirements.lock
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm ls --depth=0
      - name: Verify test-only static site
        working-directory: site
        run: |
          npm run check:test
          npm audit --audit-level=high
          npm run build:test
          breachgazette audit-public-tree dist --json
      - name: Verify configured root deployment build
        working-directory: site
        env:
          BREACHGAZETTE_SITE_URL: "https://breachgazette.example"
        run: |
          npm run build:test
          breachgazette audit-public-tree dist --json
      - name: Check patches
        run: git diff --check

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Build test-only static site
        working-directory: site
        run: npm run build:test
      - name: Run browser tests
        working-directory: site
        run: npm run test:e2e:ci
