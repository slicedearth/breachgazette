    summary: CNIL imposed a €1 million administrative fine on MOBIUS SOLUTIONS LTD for breaches of processor obligations. The decision followed a notification involving data belonging to users of DEEZER. The named respondent is the processor, not DEEZER; no court judgment or appeal outcome is asserted here.
